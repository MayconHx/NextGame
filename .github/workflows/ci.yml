name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: meu_banco_docker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d meu_banco_docker"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres on localhost:5432..."
          for i in {1..60}; do
            nc -z localhost 5432 && break || sleep 1
          done

      - name: Seed DB (apply init.sql)
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client netcat
          psql -h localhost -U postgres -d meu_banco_docker -f docker/postgres/init.sql || true

      - name: Start app
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: meu_banco_docker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          PORT: 3000
        run: |
          npm start &
          # espera o servidor responder
          for i in {1..30}; do
            curl -sSf http://localhost:3000/health && break || sleep 1
          done

      - name: Run CI tests (container + steam)
        run: npm run ci:test --silent
