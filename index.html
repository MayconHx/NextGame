<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recomendador de Jogos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="modal" class="modal">
    <div class="modal-content">
      <h2>Bem-vindo(a) ao NextGame</h2>
      <p style="margin-bottom:12px">Responda 6 perguntas rápidas. Em alguns segundos eu recomendo um jogo que combina com o que você quer jogar agora.</p>
      <button id="startBtn">Começar</button>
    </div>
  </div>

  <div class="container">
    <h1>NextGame — Recomendador de Jogos</h1>
    <div class="progress" id="progress" style="display:none"><i></i></div>
    <div class="layout">
      <div id="quiz" aria-live="polite"></div>
      <aside id="avatarPanel" class="avatar-panel" aria-hidden="false">
        <h4>Seu personagem</h4>
        <div id="avatar" class="avatar"></div>
        <p class="hint">Acessórios aparecem conforme suas escolhas.</p>
      </aside>
    </div>
    <div id="resultado" aria-live="polite"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
